name: Build minieap Windows x86_64
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libpcap

      - name: Verify config.mk
        shell: msys2 {0}
        run: |
          echo "=== PLUGIN_MODULES ==="
          grep -A5 "PLUGIN_MODULES" config.mk
          echo "=== ENABLE_ICONV ==="
          grep ENABLE_ICONV config.mk

      - name: Build minieap
        shell: msys2 {0}
        run: |
          make EXE=minieap.exe

      - name: Copy runtime dll
        shell: msys2 {0}
        run: |
          cp /mingw64/bin/libwinpthread-1.dll .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: minieap-win-x64
          path: |
            minieap.exe
            libwinpthread-1.dll
